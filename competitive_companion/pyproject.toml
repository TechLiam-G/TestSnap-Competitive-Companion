[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "competitive-companion"
version = "0.1.0"
description = "A competitive programming testing and debugging tool"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
competitive-companion = "competitive_companion.main:run"

[tool.setuptools.packages.find]
where = ["src"]